# Allure Framework Configuration
allure.results.directory=target/allure-results

# Report metadata
allure.report.name=Facctum Test Automation Report
allure.report.version=1.0

# Links configuration - Customize as per your project needs
# allure.link.issue.pattern=https://your-jira-url/browse/{}
# allure.link.tms.pattern=https://your-test-management-url/{}

# Categories configuration
allure.categories.file=categories.json

# Environment configuration
allure.environment.browser=chrome
allure.environment.framework=Selenium+Cucumber+TestNG
allure.environment.java.version=${java.version}
allure.environment.os=${os.name}